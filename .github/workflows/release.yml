name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: |
          npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/cli/dist/depguarder.mjs

      - name: Publish to NPM
        run: |
          npm publish -w @depguarder/core -w @depguarder/rules -w @depguarder/lockfile-parser -w @depguarder/github-action --access public
          npm publish -w depguarder --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
